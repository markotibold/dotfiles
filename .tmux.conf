# invoke reattach-to-user-namespace every time a new window/pane opens
# if-shell doesn't always work
#if-shell '[ $(uname -s) = Darwin ]' \
#    'set -g default-terminal "tmux-256color"; set -g default-command "reattach-to-user-namespace -l zsh"'

# Add truecolor support
# tmux display in 256 colours
#set -g default-terminal "tmux-256color-italic"
set -g default-terminal "tmux-256color"
#  enable terminal compatibility with outside terminal
set-option -ga terminal-overrides ",xterm-256color-italic:Tc"

set -g set-clipboard on
set -g renumber-windows on

# Index starts from 1
set-option -g base-index 1
setw -g pane-base-index 1   # make pane numbering consistent with windows
setw -g automatic-rename on # rename window to reflect current program
set -g renumber-windows on  # renumber windows when a window is closed
set -g set-titles on                        # set terminal title
set -g set-titles-string '#h ❐ #S ● #I #W'

setw -g monitor-activity on
set -g visual-activity on
# set -g status-utf8 on
set -g history-limit 102400    #  scrollback buffer n lines
set -g mode-keys vi    #  user vi mode
set -g repeat-time 0
set -g mouse on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -s escape-time 1

set -g status-left-length 80
set-option -g status-left '€:₿: #(curl -s https://api.coindesk.com/v1/bpi/currentprice.json | jq '.bpi.EUR.rate_float')'
set-option -g status-right 'Transcoders prod: #(~/syncthing/scripts/prod-instances.sh | jq '.aggregations.hosts.value') '

set -g status-right-length 80
set -g status-interval 60
set -g status-position bottom

# https://github.com/neovim/neovim/wiki/FAQ#cursor-shape-doesnt-change-in-tmux
#set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

set-option -g status-style bg=black,fg=white
set-option -g status-justify centre
